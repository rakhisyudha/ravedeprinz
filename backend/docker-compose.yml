services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
      POSTGRES_DB: ravedeprinz
    ports:
      - "5433:5432"
    volumes:
      - ravedeprinz_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d ravedeprinz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    # env_file makes every Backend/.env variable visible to the
    # container (PORT, DATABASE_URL, FRONTEND_URL, UPLOADS_DIR,
    # AUTH_SEED_EMAIL, AUTH_SEED_PASSWORD). The hardcoded values
    # below only fill in defaults when a variable is missing.
    env_file:
      - .env
    environment:
      PORT: 4100
      DATABASE_URL: postgres://archive:archive@db:5432/ravedeprinz
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3100}
      UPLOADS_DIR: /data/uploads
    volumes:
      - ravedeprinz_uploads_v2:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    name: webnet

volumes:
  ravedeprinz_pgdata:
    name: ravedeprinz_pgdata
  ravedeprinz_uploads_v2:
    name: ravedeprinz_uploads_v2
